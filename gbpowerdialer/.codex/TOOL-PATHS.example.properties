# Bu dosyayı kopyalayıp `.codex/TOOL-PATHS.local.properties` olarak doldur.
# `.local.properties` dosyası geliştiriciye özeldir ve commitlenmez.
# Windows yollarında ileri slash kullanmak PowerShell ve Codex için daha az hatalıdır.

# Zorunlu: Maven binary yolu. IntelliJ'e bağımlı olmamak için standalone Maven önerilir.
# PATH'te Maven varsa `MAVEN_CMD=mvn.cmd` kullanılabilir.
MAVEN_CMD=C:/javatools/apache-maven-3.9.15/bin/mvn.cmd

# Zorunlu: Maven settings.xml yolu. Repository, mirror ve credential sözleşmeleri buradan okunur.
MAVEN_SETTINGS=C:/Users/GLB90114534/.m2/settings.xml

# Zorunlu: Codex Maven komutlarını offline çalıştırır; eksik artifact varsa kullanıcı VPN'de cache'i günceller.
MAVEN_OFFLINE=true

# Opsiyonel: Standart dışı local repository kullanılıyorsa doldur.
MAVEN_REPO_LOCAL=C:/Users/GLB90114534/.m2/repository

# Zorunlu: Projenin derleme/test için kullandığı JDK. gbpowerdialer Java 8 hedeflidir.
JAVA_HOME=C:/Users/GLB90114534/Desktop/jdk8u432-b06/jdk8u432-b06

# Opsiyonel: Lokal Tomcat ile çalışma gerektiğinde doldur.
CATALINA_HOME=C:/Users/GLB90114534/Desktop/apache-tomcat-9.0.98
TOMCAT_HOME=C:/Users/GLB90114534/Desktop/apache-tomcat-9.0.98

# Opsiyonel: VS Code task'ları local generated CATALINA_BASE kullanır.
# Boş bırakılırsa `.vscode/.local/tomcat-base` kullanılır ve commitlenmez.
TOMCAT_BASE=

# Opsiyonel: VS Code Tomcat debug task'ları için Maven profile ve debug ayarları.
# IntelliJ .idea/misc.xml içinde aktif profile `properties-tr-dev` olduğu için varsayılan budur.
MAVEN_PROFILE=properties-tr-dev
VSCODE_MAVEN_OFFLINE=false
TOMCAT_DEBUG_PORT=5005
TOMCAT_DEBUG_SUSPEND=n
TOMCAT_HTTP_PORT=18080
TOMCAT_SHUTDOWN_PORT=18005
TOMCAT_OPEN_BROWSER=true
TOMCAT_OPEN_BROWSER_DELAY_SECONDS=5
APP_CONTEXT_PATH=gbpowerdialer

# Opsiyonel: PATH dışında Node/NPM kullanılıyorsa doldur.
NPM_CMD=C:/Program Files/nodejs/npm.cmd
