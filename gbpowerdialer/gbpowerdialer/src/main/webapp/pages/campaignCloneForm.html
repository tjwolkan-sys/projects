<div>
	<div class="modal-header">
		<h3 class="modal-title">{{'campaign.form' | i18n}}</h3>
	</div>
	<form name="campaignForm" ng-submit="campaignForm.$valid && campaignClone.save();" novalidate>
		<div class="modal-body">
			<div class="row">
				<div class="col-lg-12">
					<div class="form-group" ng-class="{ 'has-error' : (campaignForm.$submitted || campaignForm.campaignName.$touched) && campaignForm.campaignName.$invalid }">
						<label for="campaign.name">
							{{'campaign.name' | i18n}}
							<span style="color: red;">*</span>
						</label>
						<input id="campaign.name" name="campaignName" type="text" class="form-control input-sm" ng-model="campaignClone.item.name" ng-required="true" maxlength="255"
						       ng-error-messages>
					</div>
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<button class="btn btn-primary" type="submit">
				<i class="fa fa-floppy-o"></i> {{'label.save' | i18n}}
			</button>
			<button class="btn btn-warning" type="button" ng-click="campaignClone.cancel()">
				<i class="fa fa-close"></i> {{'label.cancel' | i18n}}
			</button>
		</div>
	</form>
</div>
