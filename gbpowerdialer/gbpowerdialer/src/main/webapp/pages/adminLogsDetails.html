<div>
  <div class="modal-header">
    <h3 class="modal-title">{{'admin.logs.details' | i18n}}</h3>
  </div>
  <div class="modal-body">
    <div class="panel panel-primary">
      <div class="panel-heading">
        <h3 class="panel-title">{{'admin.logs' | i18n}}</h3>
        <div class="panel-buttons pull-right"></div>
      </div>
      <div class="panel-body">
        <div>
          <div id="adminLogsGrid" ui-grid="admLogsDetails.adminLogsDetailsGridOptions" ui-grid-resize-columns ui-grid-auto-resize class="grid" ng-style="{'height': '200px'}"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" type="button" ng-click="admLogsDetails.close()">{{'label.ok' | i18n}}</button>
  </div>
</div>
