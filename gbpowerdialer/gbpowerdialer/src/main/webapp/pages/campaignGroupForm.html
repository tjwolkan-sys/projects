<div>
  <div class="modal-header">
    <h3 class="modal-title">{{'campaignGroup.form' | i18n}}</h3>
  </div>
  <form name="campaignGroupPhone" novalidate>
    <div class="modal-body">
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group"
            ng-class="{ 'has-error' : (campaignGroupPhone.$submitted || campaignGroupPhone.campaignGroupGroup.$touched) && campaignGroupPhone.campaignGroupGroup.$invalid }">
            <label for="campaignGroup.group">
              {{'campaignGroup.group' | i18n}} <span style="color: red;">*</span>
            </label>
            <select id="campaignGroup.group" name="campaignGroupGroup" class="form-control input-sm" ng-model="campaignGroup.item.group"
              ng-options="item as item.name for item in campaignGroup.groupList track by item.id" ng-required="true" ng-error-messages>
              <option value="">{{'input.option.select' | i18n}}</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group"
            ng-class="{ 'has-error' : (campaignGroupPhone.$submitted || campaignGroupPhone.campaignGroupPriority.$touched) && campaignGroupPhone.campaignGroupPriority.$invalid }">
            <label for="campaignGroup.priority">
              {{'campaignGroup.priority' | i18n}} <span style="color: red;">*</span>
            </label>
            <input id="campaignGroup.priority" name="campaignGroupPriority" type="number" min="0" class="form-control input-sm" ng-model="campaignGroup.item.priority"
              ng-required="true" ng-error-messages />
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group">
            <label for="campaignGroup.enabled">{{'label.enabled' | i18n}} </label>
            <input id="campaignGroup.enabled" type="checkbox" ng-model="campaignGroup.item.enabled" />
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="buttonSave" type="submit" ng-show="campaignGroup.isEditGroup()" class="btn btn-primary saveButton" ng-click="campaignGroupPhone.$valid && campaignGroup.save()">
        <i class="fa fa-floppy-o" ></i>
        {{'label.save' | i18n}}
      </button>
      <div id class="btn-group" uib-dropdown ng-show="!campaignGroup.isEditGroup()">
        <button id="saveButton" type="submit" class="btn btn-primary" ng-click="campaignGroupPhone.$valid && campaignGroup.save()">{{'label.save' | i18n}}</button>
        <button type="button" class="btn btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <span class="caret"></span> <span class="sr-only">Toggle Dropdown</span>
        </button>
        <ul class="dropdown-menu" uib-dropdown-menu role="menu" aria-labelledby="single-button">
          <li role="menuitem">
            <button id="saveAndContinueButton" type="submit" ng-click="campaignGroupPhone.$valid && campaignGroup.saveAndContinue()">{{'label.saveAndContinue' |
            i18n}}</button></li>
        </ul>
      </div>
      <button class="btn btn-warning" type="button" ng-click="campaignGroup.cancel()">
        <i class="fa fa-close"></i> {{'label.cancel' | i18n}}
      </button>
    </div>
  </form>
</div>
