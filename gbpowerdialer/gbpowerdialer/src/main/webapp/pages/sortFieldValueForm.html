<div>
  <div class="modal-header">
    <h3 class="modal-title">{{'sortFieldValue.form' | i18n}}</h3>
  </div>
  <form name="sortFieldValueForm" ng-submit="sortFieldValueForm.$valid && sortFieldValue.save()" novalidate>
    <div class="modal-body">
      <div class="row">
        <div class="col-lg-6">
          <div class="form-group"
            ng-class="{ 'has-error' : (sortFieldValueForm.$submitted || sortFieldValueForm.columnName.$touched) && sortFieldValueForm.columnName.$invalid }">
            <label for="sortFieldValue.value">
              {{'sortFieldValue.value' | i18n}}
              <span style="color: red;">*</span>
            </label>
            <input id="sortFieldValue.value" name="value" type="text" class="form-control input-sm" ng-model="sortFieldValue.item.value"
                   ng-required="true" maxlength="255" ng-error-messages>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="form-group"
            ng-class="{ 'has-error' : (sortFieldValueForm.$submitted || sortFieldValueForm.priority.$touched) && sortFieldValueForm.priority.$invalid }">
            <label for="sortFieldValue.priority">
              {{'sortFieldValue.priority' | i18n}} <span style="color: red;">*</span>
            </label>
            <input id="sortFieldValue.priority" name="priority" type="number" min="1" class="form-control input-sm" ng-model="sortFieldValue.item.priority"
              ng-required="true" ng-error-messages />
          </div>
        </div>
        <div class="col-lg-12">
	        <div class="form-group">
            <label for="sortFieldValue.enabled">{{'label.enabled' | i18n}} </label>
            <input id="sortFieldValue.enabled" type="checkbox" ng-model="sortFieldValue.item.enabled" />
          </div>
	      </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" type="submit">
        <i class="fa fa-floppy-o"></i> {{'label.save' | i18n}}
      </button>
      <button class="btn btn-warning" type="button" ng-click="sortFieldValue.cancel()">
        <i class="fa fa-times"></i> {{'label.cancel' | i18n}}
      </button>
    </div>
  </form>
</div>
