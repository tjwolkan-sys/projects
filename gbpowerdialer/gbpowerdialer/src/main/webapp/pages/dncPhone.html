<div>
  <div class="modal-header">
    <h3 class="modal-title">{{'dnc.phone.form' | i18n}}</h3>
  </div>
  <form name="dncPhone" ng-submit="dncPhone.$valid && dncphone.save()" novalidate>
    <div class="modal-body">
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group" ng-class="{ 'has-error' : (dncPhone.$submitted || dncPhone.dncPhoneNumber.$touched) && dncPhone.dncPhoneNumber.$invalid }">
            <label for="dnc.phoneNumber">
              {{'dnc.number' | i18n}}<span style="color: red;">*</span>
            </label>
            <input type="text" id="dnc.phoneNumber" name="dncPhoneNumber" class="form-control input-sm" ng-model="dncphone.item.phoneNumber" ng-required="true" maxlength="255"  ng-pattern="/^[0-9]+$/"
                   ng-keypress="($event.charCode >= 48 && $event.charCode <= 57) || $event.preventDefault()"
              ng-error-messages>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group">
            <label for="dnc.phoneExpiredDate"> {{'dnc.expiredDate' | i18n}} </label>
            <div class="dropdown">
              <a class="dropdown-toggle expiredDate-select-phone" role="button" data-toggle="dropdown" data-target="javascript:void(0)" href="">
                <div class="input-append">
                  <input id="dnc.phoneExpiredDate" name="dncPhoneExpiredDate" type="text" class="form-control input-sm" ng-model="dncphone.item.expiredDate" ng-format-date="dd/MM/yyyy HH:mm" readonly
                          ng-error-messages />
                </div>
              </a>
              <ul class="dropdown-menu" role="menu" aria-labelledby="dLabel">
                <datetimepicker data-ng-model="dncphone.item.expiredDate" data-datetimepicker-config="{ dropdownSelector: '.expiredDate-select-phone' }"> </datetimepicker>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group">
            <label for="dnc.enabled">{{'label.enabled' | i18n}}</label>
            <input id="dnc.enabled" type="checkbox" ng-model="dncphone.item.enabled" />
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" type="submit">
        <i class="fa fa-floppy-o"></i> {{'label.save' | i18n}}
      </button>
      <button class="btn btn-warning" type="button" ng-click="dncphone.cancel()">
        <i class="fa fa-times"></i> {{'label.cancel' | i18n}}
      </button>
    </div>
  </form>
</div>
