<script type="text/ng-template" id="error-messages">
	<p ng-message="required" style="font-size: 13px">{{'form.required' | i18n}}</p>
	<p ng-message="min" style="font-size: 13px">{{'form.validation.notless' | i18n}}</p>
	<p ng-message="max" style="font-size: 13px">{{'form.validation.notgreater' | i18n}}</p>
	<p ng-message="pattern" style="font-size: 13px">{{'form.validation.pattern' | i18n}}</p>
	<p ng-message="minlength" style="font-size: 13px">This field is too short</p>
	<p ng-message="maxlength" style="font-size: 13px">This field is too long</p>
	<p ng-message="email" style="font-size: 13px">This needs to be a valid email</p>
	<p ng-message="databasecolumn" style="font-size: 13px">{{'form.validation.databasecolumn' | i18n}}</p>
	<p ng-message="validatetablename" style="font-size: 13px"> {{'form.validation.validatetablename' | i18n}} </p>
	<p ng-message="validatefilter" style="font-size: 13px"> {{'form.validation.filter' | i18n}} </p>
