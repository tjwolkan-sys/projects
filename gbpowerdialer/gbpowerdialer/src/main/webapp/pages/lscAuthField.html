<div>
  <div class="modal-header">
    <h3 class="modal-title">{{lscField.header}}</h3>
  </div>
  <form name="lscAuthFieldForm" ng-submit="lscAuthFieldForm.$valid && lscAuthField.save()" novalidate>
    <div class="modal-body">
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group" ng-class="{ 'has-error' : (lscAuthFieldForm.$submitted || lscAuthFieldForm.lscKey.$touched) && lscAuthFieldForm.lscKey.$invalid }">
            <label for="lsc.key">
              {{'lsc.payload.key' | i18n}}: <span style="color: red;">*</span>
            </label>
            <input id="lsc.key" name="lscKey" type="text" class="form-control input-sm" ng-required="true" ng-model="lscAuthField.selected.item.key"
              ng-error-messages>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12">
          <div class="form-group" ng-class="{ 'has-error' : (lscAuthFieldForm.$submitted || lscAuthFieldForm.lscValue.$touched) && lscAuthFieldForm.lscValue.$invalid }">
            <label for="lsc.value">
              {{'lsc.payload.value' | i18n}}:
            </label>
            <input id="lsc.value" name="lscValue" type="text" class="form-control input-sm" ng-model="lscAuthField.selected.item.value"
              ng-error-messages>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" type="submit">
        <i class="fa fa-floppy-o"></i> {{'label.save' | i18n}}
      </button>
      <button class="btn btn-warning" type="button" ng-click="lscAuthField.cancel()">
        <i class="fa fa-times"></i> {{'label.cancel' | i18n}}
      </button>
    </div>
  </form>
</div>
