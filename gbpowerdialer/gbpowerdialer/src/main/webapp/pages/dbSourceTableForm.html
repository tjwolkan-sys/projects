<div>
  <form name="dbSourceTableForm" ng-submit="dbSourceTableForm.$valid && dbTable.createSourceTable()" novalidate>
    <div class="modal-header">
      <h3 class="modal-title">{{'campaign.createSourceTable' | i18n}}</h3>
    </div>
    <div class="modal-body">
      <div class="row">
        <div class="col-lg-12 form-group" ng-class="{ 'has-error' : (dbSourceTableForm.$submitted || dbSourceTableForm.tableName.$touched) && dbSourceTableForm.tableName.$invalid }">
          <label for="tableName">
            {{'campaign.tableName' | i18n}}
            <span style="color: red;">*</span>
          </label>
          <input id="tableName" name="tableName" class="form-control input-sm" ng-model="dbTable.table.tableName"
                 ng-required="true" validatetablename="dbTable.campaign" ng-error-messages/>
        </div>
        <div class="col-lg-12 form-group">
          <label for="fetchDataRandomly">{{'campaign.fetchDataRandomly' | i18n}}</label>
          <input id="fetchDataRandomly" ng-model="dbTable.table.fetchDataRandomly" type="checkbox"/>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" type="submit">
        <i class="fa fa-floppy-o"></i> {{'label.save' | i18n}}
      </button>
      <button class="btn btn-warning" type="button" ng-click="dbTable.close()">
        <i class="fa fa-close"></i> {{'label.cancel' | i18n}}
      </button>
    </div>
  </form>
</div>
