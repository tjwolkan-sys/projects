<div>
	<div class="modal-header">
		<h3 class="modal-title">{{'uploadTool.validationResult' | i18n}}</h3>
	</div>
	<div class="modal-body">
		<div id="validationResultGrid" ui-grid="gridOptions" ui-grid-resize-columns ui-grid-auto-resize class="grid"></div>
	</div>
	<div class="modal-footer">
		<button class="btn btn-warning" type="button" ng-click="close()">
			<i class="fa fa-times"></i> {{'label.cancel' | i18n}}
		</button>
	</div>
</div>
