# Project information
application.name=@application.name@
project.version=@project.version@
project.buildDate=@project.buildDate@
project.stage=@project.stage@
maven.build.timestamp.format=@maven.build.timestamp.format@

# Database connection properties
db.connectionURL=@db.connectionURL@
db.driverClass=@db.driverClass@
db.password=@db.password@
db.username=@db.username@


# Rest service properties
rest.username=@rest.username@
rest.password=@rest.password@
rest.fetchLimit=@rest.fetchLimit@

#ldap
ldap.keystore.path=@ldap.keystore.path@
ldap.keystore.password=@ldap.keystore.password@

#Encryptors Campaign dbPassword
campaign.iv.key=@campaign.iv.key@
campaign.secret.key=@campaign.secret.key@

#properties for campaign logging
campaign.appender.file.path=${catalina.home}/logs/gbpowerdialer.
campaign.appender.file.suffix=-%d{yyyy-MM-dd}.log.zip
campaign.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p - %m%n

# Predefined PBX dialplan inbound contexts
pbx.context.outboundIvr=from-dialer
pbx.context.progressive=from-dialer
pbx.context.preview=from-dialer-preview

# AMI settings
manager.connection.login.attempts = 3
manager.connection.ping.attempts = 3
manager.connection.ping.timeout = 10
manager.connection.check.interval = 60
uploadTool.fileDirectory = @uploadTool.fileDirectory@
uploadTool.filesLifetimeDays = @uploadTool.filesLifetimeDays@

# dashboard connection properties
dashboard.rest.url = @dashboard.rest.url@
dashboard.rest.username = @dashboard.rest.username@
dashboard.rest.password = @dashboard.rest.password@

#properties for campaign schedule checker
campaign.schedule.delay = 60000

#properties for mirror
mirror.batch.size.rc = 5000
mirror.batch.size.rcc =10000
mirror.batch.size.trc = 5000
jobs.mirror-result.cron = 0 30 7 * * *

#properties for expire cron job
jobs.campaign-result.cron=0 45 8 * * *

#properties for dnc delta-sync job (FEAT-318332)
jobs.dnc-delta-sync.cron = 0 45 8 * * *
jobs.dnc-delta-sync.batch.size = 500

eureka.enabled = @eureka.enabled@
requireTokenForRestAPI = @requireTokenForRestAPI@
previewTimeoutOriginationDelaySec = 20
rds.popup.url = @rds.popup.url@

#FastAGI thread pool: every bridged call holds one thread; when max is reached new answered calls are dropped (rc84)
agi.server.pool.size = 10
agi.server.max.pool.size = 1000

#properties for FCT channel capacity gate (FEAT-GLB90114534-FCT-KANAL-KAPASITE-GATE)
# gate kill switch: false ise kapasite kontrolu tamamen pasif, davranis 04.05.2026 FCT routing akisiyla ayni kalir
fct.channel.gate.enabled = true
# rezervasyon TTL'i: bu sureyi asan in-flight kayitlari acquire/snapshot yolunda prune edilir (kacan release self-healing).
# Constants.CALL_EXPIRE_TIMEOUT (3600000) + 5 dk pay: dialer'in kendi "bu cagri artik yasayamaz" esiginden SONRA prune eder,
# boylece konusma halindeki uzun cagrinin kanali erken serbest birakilmaz.
fct.channel.ttl.ms = 3900000
# rezervasyon bu yasi gecerse prune EDILMEZ ama monitor ekraninda "kacmis release adayi" olarak kirmizi gosterilir
fct.channel.stale.warn.ms = 600000
# cause 34 sonrasi numaranin atlanacagi cooldown suresi
fct.channel.cooldown.ms = 60000
# kapasitenin yuzde kaci headroom olarak ayrilacak (restart penceresi ve PD disi tuketiciler icin pay)
fct.channel.headroom.percent = 10
# trafigi durmus numaranin monitor ekraninda kalma suresi (metadata retention)
fct.channel.meta.retention.ms = 1800000
# monitor feed'i icin tutulan bounded olay sayisi
fct.channel.event.log.size = 200
# tum uygun FCT'ler dolu iken cagrinin kuyrukta kac tick bekleyecegi; asilirsa mevcut no-callerid akisina duser
fct.channel.defer.limit = 10
# cause 34 sonrasi AYNI cagri icinde kac kez siradaki FCT ile yeniden originate edilecegi.
# 30.09.2026 (Faz 2): 0 -> 1. 08.09'daki "kanal-zamani maliyeti kesin" gerekcesi Asterisk h
# extension guard'iyla hafifledi: HAS_NEXT=1 gelen cause 34 bacaginda Disconnect/ODBC/hangup_data/
# EXEC/qos adimlari atlandigi icin ara bacak yan etkisiz kaliyor. Siradaki FCT'ye tek gecis hakki.
# gate.enabled=false iken bu sinir uygulanmaz (04.05 FCT routing davranisi birebir geri gelir).
fct.channel.list.retry.max = 1
# snapshot endpoint'inin cache suresi (polling yukunu sinirlar)
fct.channel.snapshot.cache.ms = 1000
# FCT listesi tukendikten sonra kampanyanin sabit hat caller ID'siyle (Campaign.callerId) kac kez
# yeniden originate edilecegi. Bu butce fct.channel.list.retry.max'ten AYRIDIR ve onun guard'inin
# disinda degerlendirilir: sabit hat FCT kapasitesiyle ilgili degildir, bu yuzden list.retry.max=0
# iken bile calisir. Kampanyada sabit hat bos ise fallback kapalidir (guvenli varsayilan).
fct.fixed.line.retry.max = 1
