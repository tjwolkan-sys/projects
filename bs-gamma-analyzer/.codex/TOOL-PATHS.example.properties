# Bu dosyayı kopyalayıp `.codex/TOOL-PATHS.local.properties` olarak doldur.
# `.local.properties` dosyası geliştiriciye özeldir ve commitlenmez.
# Windows yollarında ileri slash kullanmak PowerShell ve ajan için daha az hatalıdır.

# Zorunlu: Python binary yolu. IDE'ye bağımlı olmamak için standalone Python veya virtualenv tercih edilir.
# PATH'te Python varsa `PYTHON_CMD=python` kullanılabilir.
PYTHON_CMD=C:/Users/GLB90114534/AppData/Local/Programs/Python/Python311/python.exe

# Opsiyonel: Virtualenv klasörü. Dolu ise `VENV_DIR/Scripts/python.exe` kullanılır.
VENV_DIR=C:/Users/GLB90114534/Desktop/projects-new/bs-gamma-analyzer/.venv

# Zorunlu: Pip komutları ajan tarafından offline çalıştırılır; eksik paket varsa kullanıcı VPN'de cache'i günceller.
PIP_OFFLINE=true

# Opsiyonel: Standart dışı pip cache veya internal index kullanılıyorsa doldur.
PIP_CACHE_DIR=C:/Users/GLB90114534/AppData/Local/pip/Cache
PIP_INDEX_URL=
PIP_EXTRA_INDEX_URL=

# Opsiyonel: Streamlit binary yolu. PATH'te varsa boş bırak.
STREAMLIT_CMD=C:/Users/GLB90114534/Desktop/projects-new/bs-gamma-analyzer/.venv/Scripts/streamlit.exe

# Opsiyonel: Pytest binary yolu. PATH veya virtualenv otomatik bulamazsa doldur.
PYTEST_CMD=

# Opsiyonel: VS Code task'ları offline değil, online pip kullanabilir.
VSCODE_PIP_OFFLINE=false

# Opsiyonel: PostgreSQL erişimi için lokal doğrulama bilgileri. Şifre yer tutucu olarak kalır.
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=gamma_dev
POSTGRES_USER=gamma_ro
# POSTGRES_PASSWORD: Şifre buraya yazılmaz; OS keyring veya developer'ın güvenli lokal standardı kullanılır.

# Opsiyonel: Anthropic API key bu dosyaya yazılmaz. Sidebar üzerinden runtime'da girilir.
# ANTHROPIC_API_KEY: Bu dosyaya yazılmaz; secret yönetimi için bkz. docs/architecture/CONFIGURATION-AND-SECRETS.md
